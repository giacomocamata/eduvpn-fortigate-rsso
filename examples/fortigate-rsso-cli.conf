# FortiGate CLI snippets to configure RSSO for eduvpn-radius.
# Replace the placeholders below with your real values before pasting:
#   <interface-name>   the interface that receives traffic from the eduVPN gateway
#   vpn.example.org     the eduVPN gateway sending Accounting packets (NAS)
#   CHANGE_ME_use_a_long_random_secret   must match `secret` in eduvpn-radius.conf
#   10.20.0.0/22        the aggregate of all your VPN IPv4 address pools
#   <inbound-interface> / <outbound-interface>   your actual policy interfaces
#
# Tested on FortiOS 7.4.x. Apply one block at a time and verify with the
# matching `show` command before moving to the next (see README.md).

# --- 1) Enable RADIUS Accounting reception on the receiving interface ------
config system interface
    edit "<interface-name>"
        append allowaccess radius-acct
    next
end

# --- 2) Create the RSSO Agent (External Connector) ------------------------
config user radius
    edit "eduvpn-rsso"
        set rsso enable
        set rsso-secret "CHANGE_ME_use_a_long_random_secret"
        set rsso-radius-response enable
        set rsso-endpoint-attribute Framed-IP-Address
        set sso-attribute Called-Station-Id
        set rsso-flush-ip-session enable
        set rsso-log-flags all
    next
end

# --- 3) Create the RSSO user group -----------------------------------------
config user group
    edit "eduvpn-vpn-users"
        set group-type rsso
        set member "eduvpn-rsso"
    next
end

# --- 4) Reference the group in a firewall policy ---------------------------
config firewall policy
    edit 0
        set name "eduvpn-users-internet"
        set srcintf "<inbound-interface>"
        set dstintf "<outbound-interface>"
        set srcaddr "10.20.0.0/22"
        set dstaddr "all"
        set groups "eduvpn-vpn-users"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set logtraffic-start enable
    next
end
